# Runs Android CI tasks (ktlint check, unit tests, and build compilation)
# conditionally on pull requests when files under apps/android/ change.
name: Android CI

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x apps/android/gradlew

      - name: Run Code Format Checks (ktlint)
        run: |
          cd apps/android
          ./gradlew ktlintCheck

      - name: Run Unit Tests and Verify Compilation
        run: |
          cd apps/android
          ./gradlew testDebugUnitTest assembleDebug
