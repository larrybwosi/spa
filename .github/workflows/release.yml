name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Changesets Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
      version: ${{ steps.extract_version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Release Version
        id: extract_version
        if: steps.changesets.outputs.published == 'true'
        run: |
          PUBLISHED_PACKAGES='${{ steps.changesets.outputs.publishedPackages }}'
          VERSION=$(echo "$PUBLISHED_PACKAGES" | jq -r '.[0].version' 2>/dev/null || true)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            VERSION=$(jq -r .version apps/api/package.json)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Single GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1 || git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Release/tag $TAG already exists. Finding the next available patch version..."
            IFS='.' read -r major minor patch <<< "$VERSION"
            if [ -z "$patch" ]; then
              patch=0
            fi
            while true; do
              patch=$((patch + 1))
              NEXT_VERSION="${major}.${minor}.${patch}"
              NEXT_TAG="v${NEXT_VERSION}"
              if ! gh release view "$NEXT_TAG" >/dev/null 2>&1 && ! git rev-parse "$NEXT_TAG" >/dev/null 2>&1; then
                VERSION="$NEXT_VERSION"
                TAG="$NEXT_TAG"
                break
              fi
            done
            echo "Found available next version: $VERSION (Tag: $TAG)"
          fi
          echo "Creating single GitHub Release for tag: $TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes --target "${{ github.sha }}"

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Release Tags
        id: extract_version
        run: |
          PUBLISHED_PACKAGES='${{ needs.release.outputs.publishedPackages }}'
          echo "Published packages: $PUBLISHED_PACKAGES"

          API_VERSION=$(echo "$PUBLISHED_PACKAGES" | jq -r '.[] | select(.name == "api") | .version' 2>/dev/null || true)
          if [ -z "$API_VERSION" ] || [ "$API_VERSION" = "null" ]; then
            API_VERSION=$(jq -r .version apps/api/package.json)
          fi
          API_GIT_TAG="api-$API_VERSION"

          WEB_VERSION=$(echo "$PUBLISHED_PACKAGES" | jq -r '.[] | select(.name == "web") | .version' 2>/dev/null || true)
          if [ -z "$WEB_VERSION" ] || [ "$WEB_VERSION" = "null" ]; then
            WEB_VERSION=$(jq -r .version apps/web/package.json)
          fi
          WEB_GIT_TAG="web-$WEB_VERSION"

          echo "api_version=$API_VERSION" >> $GITHUB_OUTPUT
          echo "api_git_tag=$API_GIT_TAG" >> $GITHUB_OUTPUT
          echo "web_version=$WEB_VERSION" >> $GITHUB_OUTPUT
          echo "web_git_tag=$WEB_GIT_TAG" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/larrybwosi/spa/api:latest
            ghcr.io/larrybwosi/spa/api:${{ github.sha }}
            ghcr.io/larrybwosi/spa/api:${{ steps.extract_version.outputs.api_version }}
            ghcr.io/larrybwosi/spa/api:${{ steps.extract_version.outputs.api_git_tag }}

      - name: Build and Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/larrybwosi/spa/web:latest
            ghcr.io/larrybwosi/spa/web:${{ github.sha }}
            ghcr.io/larrybwosi/spa/web:${{ steps.extract_version.outputs.web_version }}
            ghcr.io/larrybwosi/spa/web:${{ steps.extract_version.outputs.web_git_tag }}
