services:
  db:
    image: postgres:18-alpine
    container_name: spa-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-spa_database}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-spa_database}"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: spa-nestjs-api
    restart: always
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/spa_database?sslmode=disable}
      PORT: 3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SCRYME_CLIENT_ID: ${SCRYME_CLIENT_ID}
      SCRYME_CLIENT_SECRET: ${SCRYME_CLIENT_SECRET}
      SCRYME_API_KEY: ${SCRYME_API_KEY}
      SCRYME_ORG_SLUG: ${SCRYME_ORG_SLUG}
      SCRYME_LOCATION_ID: ${SCRYME_LOCATION_ID}
      SCRYME_API_URL: ${SCRYME_API_URL}
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: spa-nextjs-web
    restart: always
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      PORT: 3000
    depends_on:
      - api
volumes:
  postgres_data:
